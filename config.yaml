database:
  host: db
  port: 5432
  name: ${DB_NAME}
  user: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  ssl: disable
redis:
  host: cache
  port: 6379
  password: ${REDIS_PASSWORD}
  username: ${REDIS_USERNAME}
  db: 0
rabbitmq:
  url: amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
telegram:
  api-key: ${BOT_TOKEN}
  bot-link: ${BOT_LINK}
  mini-app: ${MINI_APP_URL}
exchange:
  max-retries: 20
  retry-delay: 30
website:
  port: 443
  backend-port: 8080
  key-file: /app/certs/server.key
  cert-file: /app/certs/server.crt
  front-url: http://front:3000
  jwt-secret: ${JWT_SECRET}
  subscription-price: 10
  subscription-currency: USD
  trial:
    days_window: 7
    max_notifications: 7
